<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MaisonDrop — Accès</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="panel narrow">
        <div class="brand">MaisonDrop</div>
        <h1>Connexion</h1>
        <p class="muted">
            Entre le code affiché dans la fenêtre MaisonDrop sur ton PC.
        </p>

        {% for category, message in get_flashed_messages(with_categories=true) %}
            <div class="notice {{ category }}">{{ message }}</div>
        {% endfor %}

        <form method="post" class="stack">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="pin">Code PIN</label>
            <input
                id="pin"
                name="pin"
                type="text"
                inputmode="numeric"
                autocomplete="one-time-code"
                autocapitalize="off"
                spellcheck="false"
                required
                maxlength="12"
                autofocus
            >
            <button type="submit">Ouvrir MaisonDrop</button>
        </form>
    </main>
</body>
</html>
